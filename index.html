<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Teaser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 1920;
const H = 1080;
canvas.width = W;
canvas.height = H;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

const SKY_PIXEL = 6;
const SW = Math.ceil(W / SKY_PIXEL);
const SH = Math.ceil(H / SKY_PIXEL);

const GSCALE = 8;
const GROUND_SPEED = 2;
let groundScroll = 0;

const CHAR_W = 16;
const CHAR_H = 16;
const CHAR_SCALE = 4;
let charFrame = 0;
let charFrameTimer = 0;
let npcSpawnTimer = 120;

const groundImg = new Image();
groundImg.src = 'ground.png';

const charImgs = [1, 2, 3, 4].map(n => {
  const img = new Image();
  img.src = `sprites/p${n}.png`;
  return img;
});

const npcNames = [
  'ac_1', 'ac_2', 'ac_3', 'ac_4', 'ac_5', 'ac_6', 'afloboy', 'amina',
  'angler', 'ao', 'board', 'cas', 'cat', 'dream',
  'duck', 'emo', 'emo2', 'friends', 'friends2', 'gori', 'hang',
  'hawaii', 'hisaro', 'ice', 'ind', 'keeper', 'kori', 'lee', 'lucha',
  'minami', 'misaki', 'mizugi_f', 'mizugi_m', 'nidhogg2', 'ninja', 'pizza2',
  'ponydeadyouth', 'samrai', 'sarfer', 'smith', 'smithfun', 'spacesisters1',
  'tsunagi', 'tsunagi2', 'ufogirl', 'wendy', 'workman', 'yasu', 'zenshin',
];
const npcImgs = npcNames.map(name => {
  const img = new Image();
  img.src = `sprites/NPCS/${name}.png`;
  return { name, img };
});
const npcFrameSizes = {
  angler: { w: 16, h: 32 },
  nidhogg2: { w: 32, h: 32 },
};
const npcs = [];

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function drawSky() {
  for (let y = 0; y < SH; y++) {
    const t = y / SH;
    let r;
    let g;
    let b;
    if (t < 0.8) {
      const s = t / 0.8;
      r = lerp(0x3a, 0x5f, s);
      g = lerp(0x7b, 0xa8, s);
      b = lerp(0xd5, 0xe8, s);
    } else {
      const s = (t - 0.8) / 0.2;
      r = lerp(0x5f, 0xa8, s);
      g = lerp(0xa8, 0xd8, s);
      b = lerp(0xe8, 0xf8, s);
    }
    ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
    ctx.fillRect(0, y * SKY_PIXEL, W, SKY_PIXEL);
  }
}

const CLOUD_L = '#ffffff';
const CLOUD_M = '#e8f4ff';
const CLOUD_S = '#cce8ff';
const cloudTemplates = [
  { width: 42, blocks: [
    { x: 8, y: 10, w: 26, h: 6, c: CLOUD_M }, { x: 4, y: 6, w: 34, h: 8, c: CLOUD_M },
    { x: 10, y: 2, w: 14, h: 6, c: CLOUD_L }, { x: 20, y: 4, w: 12, h: 6, c: CLOUD_L },
    { x: 2, y: 8, w: 10, h: 6, c: CLOUD_L }, { x: 30, y: 6, w: 10, h: 6, c: CLOUD_L },
  ] },
  { width: 30, blocks: [
    { x: 4, y: 8, w: 22, h: 4, c: CLOUD_M }, { x: 2, y: 4, w: 26, h: 6, c: CLOUD_M },
    { x: 6, y: 0, w: 10, h: 6, c: CLOUD_L }, { x: 14, y: 2, w: 10, h: 6, c: CLOUD_L },
    { x: 0, y: 6, w: 8, h: 4, c: CLOUD_S }, { x: 22, y: 4, w: 8, h: 4, c: CLOUD_S },
  ] },
  { width: 20, blocks: [
    { x: 2, y: 6, w: 16, h: 4, c: CLOUD_M }, { x: 4, y: 2, w: 12, h: 6, c: CLOUD_L },
    { x: 0, y: 4, w: 6, h: 4, c: CLOUD_S }, { x: 14, y: 4, w: 6, h: 4, c: CLOUD_S },
    { x: 6, y: 0, w: 8, h: 4, c: CLOUD_L },
  ] },
  { width: 36, blocks: [
    { x: 0, y: 4, w: 36, h: 4, c: CLOUD_M }, { x: 4, y: 0, w: 28, h: 6, c: CLOUD_M },
    { x: 8, y: 0, w: 8, h: 4, c: CLOUD_L }, { x: 20, y: 0, w: 8, h: 4, c: CLOUD_L },
  ] },
];

function spawnCloud(startX) {
  const tpl = cloudTemplates[Math.random() * cloudTemplates.length | 0];
  return {
    x: startX,
    y: 8 + Math.random() * (SH * 0.65) | 0,
    speed: 0.18 + Math.random() * 0.12,
    tpl,
    opacity: 0.85 + Math.random() * 0.15,
  };
}

const clouds = [];
for (let i = 0; i < 9; i++) {
  clouds.push(spawnCloud(Math.random() * (SW + 70) - 30));
}

function drawClouds() {
  for (let i = clouds.length - 1; i >= 0; i--) {
    const cloud = clouds[i];
    cloud.x -= cloud.speed;
    if (cloud.x + cloud.tpl.width < -5) clouds[i] = spawnCloud(SW + 4);

    ctx.globalAlpha = cloud.opacity;
    for (const block of cloud.tpl.blocks) {
      ctx.fillStyle = block.c;
      ctx.fillRect(
        (cloud.x + block.x | 0) * SKY_PIXEL,
        (cloud.y + block.y | 0) * SKY_PIXEL,
        block.w * SKY_PIXEL,
        block.h * SKY_PIXEL
      );
    }
    ctx.globalAlpha = 1;
  }
}

function drawGround() {
  if (!groundImg.complete || !groundImg.naturalWidth) return;

  ctx.imageSmoothingEnabled = false;
  const iw = groundImg.naturalWidth;
  const ih = groundImg.naturalHeight;
  const dw = iw * GSCALE;
  const dh = ih * GSCALE;
  const y = H - dh;
  const scroll = ((groundScroll | 0) % dw + dw) % dw;

  ctx.drawImage(groundImg, 0, 0, iw, ih, -scroll, y, dw, dh);
  ctx.drawImage(groundImg, 0, 0, iw, ih, dw - scroll, y, dw, dh);
  if (dw - scroll < W) {
    ctx.drawImage(groundImg, 0, 0, iw, ih, dw * 2 - scroll, y, dw, dh);
  }

  groundScroll += GROUND_SPEED;
  if (groundScroll >= dw) groundScroll -= dw;
}

function spawnNpc() {
  const source = npcImgs[Math.random() * npcImgs.length | 0];
  npcs.push({
    source,
    x: W + 80 + Math.random() * 220,
    speed: 1.4 + Math.random() * 1.2,
  });
}

function drawNpcs() {
  npcSpawnTimer--;
  if (npcSpawnTimer <= 0) {
    spawnNpc();
    npcSpawnTimer = 360 + Math.random() * 720 | 0;
  }

  ctx.imageSmoothingEnabled = false;
  for (let i = npcs.length - 1; i >= 0; i--) {
    const npc = npcs[i];
    const { name, img } = npc.source;
    if (!img.complete || !img.naturalWidth) {
      npc.x -= npc.speed;
      continue;
    }

    const special = npcFrameSizes[name];
    const frameW = special ? special.w : CHAR_W;
    const frameH = special ? special.h : CHAR_H;
    const frame = charFrame % 2;
    const dw = frameW * CHAR_SCALE * 2;
    const dh = frameH * CHAR_SCALE * 2;
    const y = H - 40 * GSCALE - dh + 200;

    ctx.drawImage(img, frame * frameW, 0, frameW, frameH, npc.x, y, dw, dh);
    npc.x -= npc.speed;

    if (npc.x + dw < -80) npcs.splice(i, 1);
  }
}

function drawCharacters() {
  charFrameTimer++;
  if (charFrameTimer > 15) {
    charFrame = (charFrame + 1) % 2;
    charFrameTimer = 0;
  }

  ctx.imageSmoothingEnabled = false;
  const cW = CHAR_W * CHAR_SCALE * 2;
  const cH = CHAR_H * CHAR_SCALE * 2;
  const gap = cW + 12;
  const startX = 140;
  const y = H - 40 * GSCALE - cH + 200;
  const order = [2, 3, 1, 4];

  order.forEach((n, i) => {
    const img = charImgs[n - 1];
    if (!img.complete || !img.naturalWidth) return;
    ctx.drawImage(img, charFrame * CHAR_W, 0, CHAR_W, CHAR_H, startX + i * gap, y, cW, cH);
  });
}

function loop() {
  drawSky();
  drawClouds();
  drawGround();
  drawNpcs();
  drawCharacters();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
